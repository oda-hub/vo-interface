apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-oda-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      run: dev-oda-dispatcher
  template:
    metadata:
      labels:
        run: dev-oda-dispatcher
    spec:
      containers:
      - name: dev-oda-dispatcher
        image: odahub/vo-interface:latest
        imagePullPolicy: Never  # or IfNotPresent
        env:
        - name: DISPATCHER_GUNICORN
          value: "no"
        - name: DISPATCHER_CONFIG_FILE
          value: "/dispatcher/conf/conf.d/osa_data_server_conf.yml"
        volumeMounts:
        - name: dispatcher-config
          mountPath: /dispatcher/conf/conf.d
      - name: dispatcher-postgresql
        image: odahub/dispatcher-postgresql:latest
        imagePullPolicy: Never  # or IfNotPresent
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dispatcher-postgresql
              key: postgres-password
        - name: POSTGRES_DB
          value: "gallery_dev_prod_no_views"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: dispatcher-config
        configMap:
          name: dispatcher-config
      - name: postgres-data
        persistentVolumeClaim:
          claimName: dispatcher-postgresql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dev-oda-dispatcher-service
  labels:
    run: dev-oda-dispatcher
spec:
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
  selector:
    run: dev-oda-dispatcher
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dispatcher-postgresql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher-config
data:
  osa_data_server_conf.yml: |
    dispatcher:
      dummy_cache: dummy-cache
      products_url: PRODUCTS_URL
      dispatcher_callback_url_base: http://localhost:8001
      logstash_host:
      logstash_port: 
      token_max_refresh_interval: 604800
      soft_minimum_folder_age_days: 1
      hard_minimum_folder_age_days: 30
      bind_options:
        bind_host: 0.0.0.0
        bind_port: 8001
      email_options:
        smtp_server: 'localhost'
        site_name: 'University of Geneva'
        manual_reference: 'possibly-non-site-specific-link'
        contact_email_address: 'contact@odahub.io'
        sender_email_address: 'team@odahub.io'
        cc_receivers_email_addresses: ['team@odahub.io']
        bcc_receivers_email_addresses: ['teamBcc@odahub.io']
        smtp_port: 61025
        smtp_server_password: ''
        email_sending_timeout: True
        email_sending_timeout_default_threshold: 1800
        email_sending_job_submitted: True
        email_sending_job_submitted_default_interval: 60